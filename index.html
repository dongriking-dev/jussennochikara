<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Splash</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="video"
    src="https://drive.google.com/file/d/1woXgshGP_7fMKMSRUwEucURgAK5UayWu/preview"
    allow="autoplay"
    allowfullscreen
  ></iframe>

  <script>
    // 動画を表示してから0.5秒後に閉じる / about:blank へ
    // ※ iframe内の動画再生イベントはクロスオリジンのため取得不可。
    //   そのため「読み込み開始（またはiframeのload）から0.5秒」で計測します。
    function goBlank() {
      // 1) 閉じるを試みる
      try { window.close(); } catch (e) {}
      // 2) 閉じられなければ about:blank へ
      setTimeout(() => {
        if (!window.closed) location.replace('about:blank');
      }, 200);
    }

    const frame = document.getElementById('video');
    const timer = () => setTimeout(goBlank, 500);

    // iframeのload後に計測開始（画像版と同じ挙動に合わせる）
    frame.addEventListener('load', timer, { once: true });

    // 念のためのフォールバック（loadが発火しない環境向け）
    setTimeout(timer, 3000);
  </script>
</body>
</html>
